<title>AI LENS</title>
<script>
(function(){
  var ASSETS=[];
  var origFetch=window.fetch?window.fetch.bind(window):null;
  function matchAsset(u){
    if(!u||!ASSETS.length){return null;}
    for(var i=0;i<ASSETS.length;i++){
      if(u.indexOf(ASSETS[i].rel)>=0){return ASSETS[i];}
    }
    return null;
  }
  if(origFetch){
    window.fetch=function(input,init){
      try{
        var u=(typeof input==='string')?input:((input&&input.url)||'');
        var hit=matchAsset(u);
        if(hit){return Promise.resolve(new Response(hit.buf,{status:200,headers:{'Content-Type':hit.ct||'application/octet-stream'}}));}
      }catch(e){}
      return origFetch(input,init);
    };
  }
  window.__AI_LENS={ASSETS:ASSETS,origFetch:origFetch};
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#05070a;overflow:hidden;font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;}

canvas{position:absolute;left:0;top:0;width:100%;height:100%;}

.tag{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.32);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:12px;letter-spacing:1px;color:#fff;}

.card button[disabled]{opacity:0.5;}

<script>
(function(){
  var C='https://testingcf.jsdelivr.net/gh/tayyh19/ai-lens@1d341c29e30488f7f640f872540284a960a400cf/';
  var TF2=C+'js/tf.min.js';
  var CO2=C+'js/coco-ssd.min.js';
  var PO2=C+'js/pose-detection.min.js';
  function load(src,cb){ var s=document.createElement('script'); s.src=src; s.onload=cb; s.onerror=cb; document.head.appendChild(s); }
  function ensure(){
    if(typeof tf==='undefined'){ load(TF2,function(){ setTimeout(ensure,50); }); return; }
    if(typeof cocoSsd==='undefined'){ load(CO2,function(){ setTimeout(ensure,50); }); return; }
    if(typeof poseDetection==='undefined'){ load(PO2,function(){ setTimeout(ensure,50); }); return; }
    window.__LIBS_READY=true;
  }
  if(typeof tf!=='undefined'&&typeof cocoSsd!=='undefined'&&typeof poseDetection!=='undefined'){ window.__LIBS_READY=true; }
  else { ensure(); }
})();
</script>
<script>
function waitLibs(cb){ if(window.__LIBS_READY){ cb(); } else { setTimeout(function(){ waitLibs(cb); },120); } }
waitLibs(function(){
var C='https://gcore.jsdelivr.net/gh/tayyh19/ai-lens@1d341c29e30488f7f640f872540284a960a400cf/';
var SOURCES=[
  C,
  'https://testingcf.jsdelivr.net/gh/tayyh19/ai-lens@1d341c29e30488f7f640f872540284a960a400cf/',
  C,
  'https://testingcf.jsdelivr.net/gh/tayyh19/ai-lens@1d341c29e30488f7f640f872540284a960a400cf/',
  C,
  'https://testingcf.jsdelivr.net/gh/tayyh19/ai-lens@1d341c29e30488f7f640f872540284a960a400cf/'
];
var FILES=[
  {rel:'models/movenet-thunder/model.json', size:168151, s:0},
  {rel:'models/movenet-thunder/group1-shard1of3.bin', size:4159038, s:0},
  {rel:'models/movenet-thunder/group1-shard2of3.bin', size:4159038, s:1},
  {rel:'models/movenet-thunder/group1-shard3of3.bin', size:4159036, s:1},
  {rel:'models/coco-ssd-lite/model.json', size:257764, s:0},
  {rel:'models/coco-ssd-lite/group1-shard1of4', size:2254332, s:0},
  {rel:'models/coco-ssd-lite/group1-shard2of4', size:2254332, s:0},
  {rel:'models/coco-ssd-lite/group1-shard3of4', size:2254332, s:1},
  {rel:'models/coco-ssd-lite/group1-shard4of4', size:2254332, s:0}
];
var video=document.getElementById('video');
var cv=document.getElementById('cv');
var ctx=cv.getContext('2d');
var statusEl=document.getElementById('status');
var infoEl=document.getElementById('info');
var tagText=document.getElementById('tagText');
var startMask=document.getElementById('start');
var startBtn=document.getElementById('startBtn');
var startMsg=document.getElementById('startMsg');
var bar=document.getElementById('bar');
var btnCam=document.getElementById('btnCam');
var btnObj=document.getElementById('btnObj');
var btnPose=document.getElementById('btnPose');
var camSheet=document.getElementById('camSheet');
var camList=document.getElementById('camList');
var camClose=document.getElementById('camClose');
var EDGES=[[0,1],[0,2],[1,3],[2,4],[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];
var COLORS={person:'#ff5a5f',bicycle:'#43f5c3',car:'#43f5c3',motorcycle:'#43f5c3',bus:'#ffd166',truck:'#ffd166',cup:'#9fe8ff',bottle:'#9fe8ff',laptop:'#c084fc',tv:'#c084fc',cell_phone:'#ffd166',chair:'#43f5c3',dining_table:'#43f5c3',keyboard:'#c084fc',mouse:'#c084fc',book:'#ffd166',backpack:'#ff5a5f',clock:'#c084fc',potted_plant:'#4ade80',vase:'#4ade80',remote:'#9fe8ff',scissors:'#ffd166',teddy_bear:'#ff5a5f'};
var coco=null, detector=null;
var poseReady=false, objReady=false;
var smoothBoxes=[];
var sk=null;
var running=false;
var facing='environment';
var showObj=true, showPose=true;
var frame=0, lastT=0, fpsSmooth=0;
var cams=[];
var curCamId=null;
var DL={loaded:0, total:0, done:false};
FILES.forEach(function(f){ DL.total+=f.size; });
var ASSETS=window.__AI_LENS.ASSETS;
var origFetch=window.__AI_LENS.origFetch;

function IoU(a,b){
  var x1=Math.max(a[0],b[0]);
  var y1=Math.max(a[1],b[1]);
  var x2=Math.min(a[0]+a[2],b[0]+b[2]);
  var y2=Math.min(a[1]+a[3],b[1]+b[3]);
  var iw=Math.max(0,x2-x1), ih=Math.max(0,y2-y1);
  var inter=iw*ih;
  var ua=a[2]*a[3]+b[2]*b[3]-inter;
  return ua>0?inter/ua:0;
}

function smoothUpdate(newObjs){
  smoothBoxes.forEach(function(b){ b.matched=false; });
  newObjs.forEach(function(o){
    var best=null, bestIou=0;
    smoothBoxes.forEach(function(b){
      if(b.matched||b.cls!==o.class){return;}
      var iou=IoU(b.bbox,o.bbox);
      if(iou>bestIou){bestIou=iou;best=b;}
    });
    if(best && bestIou>0.25){
      best.matched=true;
      best.bbox=best.bbox.map(function(v,k){return v*0.4+o.bbox[k]*0.6;});
      best.score=o.score; best.ttl=8;
    } else {
      smoothBoxes.push({cls:o.class,score:o.score,bbox:o.bbox.slice(),ttl:8,matched:true});
    }
  });
  for(var i=smoothBoxes.length-1;i>=0;i--){
    var b=smoothBoxes[i];
    if(!b.matched){ b.ttl--; if(b.ttl<=0){ smoothBoxes.splice(i,1); } }
  }
}

function smoothPose(poses){
  if(!poses.length||!poses[0].keypoints){ return; }
  var kp=poses[0].keypoints;
  if(!sk){ sk=kp.map(function(k){return {x:k.x,y:k.y,s:k.score};}); return; }
  for(var i=0;i<kp.length;i++){
    var k=kp[i], o=sk[i];
    if(k.score>0.2){
      if(o.s>0.2){ o.x=o.x*0.35+k.x*0.65; o.y=o.y*0.35+k.y*0.65; o.s=k.score; }
      else { o.x=k.x; o.y=k.y; o.s=k.score; }
    } else { o.s=o.s*0.8; }
  }
}

function countVisibleKp(){
  if(!sk){ return 0; }
  var n=0;
  for(var i=0;i<sk.length;i++){ if(sk[i].s>0.3){ n++; } }
  return n;
}

function updStatusLoad(){
  var pct=Math.min(100, Math.round(DL.loaded/DL.total*100));
  if(pct>=100){ statusEl.textContent='资源就绪 · 模型初始化中...'; }
  else { statusEl.textContent='AI资源加载中 '+pct+'%'; }
}

async function fetchOne(f, attempt){
  var srcIdx=(f.s+attempt)%SOURCES.length;
  var url=SOURCES[srcIdx]+f.rel;
  var res=await origFetch(url);
  if(!res.ok){ throw new Error('HTTP '+res.status); }
  var ct=res.headers.get('content-type')||'';
  var buf;
  if(res.body && res.body.getReader){
    var reader=res.body.getReader();
    var chunks=[]; var got=0;
    while(true){
      var r=await reader.read();
      if(r.done){ break; }
      chunks.push(r.value);
      got+=r.value.length;
      DL.loaded+=r.value.length;
      updStatusLoad();
    }
    var all=new Uint8Array(got);
    var off=0;
    chunks.forEach(function(c){ all.set(c,off); off+=c.length; });
    buf=all.buffer;
  } else {
    var ab=await res.arrayBuffer();
    DL.loaded+=ab.byteLength;
    updStatusLoad();
    buf=ab;
  }
  return {rel:f.rel, buf:buf, ct:ct};
}

async function preloadGroup(files){
  await Promise.all(files.map(async function(f){
    var lastErr=null;
    for(var a=0;a<3;a++){
      try{
        var asset=await fetchOne(f,a);
        ASSETS.push(asset);
        return;
      }catch(e){ lastErr=e; }
    }
    try{ DL.loaded+=f.size; updStatusLoad(); }catch(e){}
    throw lastErr || new Error('fail '+f.rel);
  }));
}

function refreshTag(){
  if(poseReady&&objReady){ tagText.textContent='AI LENS / LIVE'; }
  else if(poseReady){ tagText.textContent='骨骼就绪 / 物体加载中'; }
  else if(objReady){ tagText.textContent='物体就绪 / 骨骼加载中'; }
  else { tagText.textContent='AI 初始化中'; }
}

async function loadPose(){
  try{
    detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.SINGLEPOSE_THUNDER,modelUrl:SOURCES[0]+'models/movenet-thunder/model.json'});
    poseReady=true;
    btnPose.disabled=false;
    btnPose.textContent='骨骼 ON';
    refreshTag();
  }catch(e){ btnPose.textContent='骨骼 加载失败'; }
}

async function loadCoco(){
  try{
    coco=await cocoSsd.load({base:'lite_mobilenet_v2',modelUrl:SOURCES[0]+'models/coco-ssd-lite/model.json'});
    objReady=true;
    btnObj.disabled=false;
    btnObj.textContent='物体框 ON';
    refreshTag();
  }catch(e){ btnObj.textContent='物体框 加载失败'; }
}

function draw(){
  if(video.videoWidth>0 && cv.width!==video.videoWidth){ cv.width=video.videoWidth; cv.height=video.videoHeight; }
  var w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  if(showObj){
    smoothBoxes.forEach(function(b){
      var x=b.bbox[0],y=b.bbox[1],bw=b.bbox[2],bh=b.bbox[3];
      var color=COLORS[b.cls]||'#43f5c3';
      ctx.strokeStyle=color;ctx.lineWidth=2;ctx.strokeRect(x,y,bw,bh);
      var text=(b.cls==='cell_phone'?'phone':b.cls)+' '+(b.score*100).toFixed(0)+'%';
      ctx.font='600 13px Consolas,monospace';
      var tw=ctx.measureText(text).width;
      ctx.fillStyle='rgba(5,7,10,0.62)';ctx.fillRect(x,y-20,tw+12,20);
      ctx.fillStyle=color;ctx.fillText(text,x+6,y-6);
    });
  }
  if(showPose && sk){
    ctx.lineWidth=2.5;ctx.strokeStyle='#22f5ff';
    EDGES.forEach(function(e){
      var ka=sk[e[0]],kb=sk[e[1]];
      if(ka.s>0.3&&kb.s>0.3){ctx.beginPath();ctx.moveTo(ka.x,ka.y);ctx.lineTo(kb.x,kb.y);ctx.stroke();}
    });
    sk.forEach(function(k){
      if(k.s>0.3){ctx.beginPath();ctx.arc(k.x,k.y,3.5,0,6.2832);ctx.fillStyle='#ff3b6b';ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=1.5;ctx.stroke();}
    });
  }
  var humanCount=0;
  if(showPose && countVisibleKp()>5){ humanCount=1; }
  if(!running){ statusEl.textContent='STANDBY'; }
  else if(!DL.done){ updStatusLoad(); }
  else if(!poseReady&&!objReady){ statusEl.textContent='模型初始化中...'; }
  else if(poseReady&&!objReady){ statusEl.textContent='骨骼就绪 · 物体加载中 | '+Math.round(fpsSmooth)+' FPS'; }
  else if(!poseReady&&objReady){ statusEl.textContent='物体就绪 · 骨骼加载中 | '+Math.round(fpsSmooth)+' FPS'; }
  else { statusEl.textContent='TARGETS '+smoothBoxes.length+' / HUMAN '+humanCount+' | '+Math.round(fpsSmooth)+' FPS'; }
}

async function loop(){
  frame++;
  var now=performance.now();
  var dt=now-lastT; lastT=now;
  if(dt>0){ var inst=1000/dt; fpsSmooth=fpsSmooth>0?fpsSmooth*0.9+inst*0.1:inst; }
  try{
    if(showPose && poseReady && frame%2===0){
      var ps=await detector.estimatePoses(video);
      smoothPose(ps);
    } else if(showObj && objReady && frame%2===1){
      var raw=await coco.detect(video,60,0.18);
      smoothUpdate(raw);
    }
  }catch(e){}
  draw();
  if(running){ requestAnimationFrame(loop); }
}

function camLabel(c,i){
  var l=(c.label||'').replace(/\s+/g,' ').trim();
  if(!l){ l='camera '+(i+1); }
  return l;
}

function shortName(c,i){
  var l=camLabel(c,i);
  var face=/front|前置/i.test(l)?'前置':((/back|后置|rear|环境/i.test(l))?'后置':'');
  var m=l.match(/camera\s*(\d+)/i);
  if(m){ return (face?face:'镜头')+' '+m[1]; }
  return face?face:'镜头'+(i+1);
}

async function loadCams(){
  try{
    var devs=await navigator.mediaDevices.enumerateDevices();
    cams=devs.filter(function(d){ return d.kind==='videoinput'; });
  }catch(e){ cams=[]; }
}

function updateCamBtn(){
  var name='镜头';
  if(curCamId){
    for(var i=0;i<cams.length;i++){
      if(cams[i].deviceId===curCamId){ name=shortName(cams[i],i); break; }
    }
  }
  btnCam.textContent=name;
}

function openCamMenu(){
  loadCams().then(function(){
    camList.innerHTML='';
    if(!cams.length){
      var d=document.createElement('div');
      d.className='camItem';
      d.textContent='未识别到其他镜头';
      camList.appendChild(d);
    }
    cams.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='camItem'+(c.deviceId===curCamId?' camActive':'');
      b.textContent=shortName(c,i)+'   ·   '+camLabel(c,i);
      b.onclick=(function(id){ return function(){ closeCamMenu(); switchCam(id); }; })(c.deviceId);
      camList.appendChild(b);
    });
    camSheet.style.display='flex';
  });
}

function closeCamMenu(){ camSheet.style.display='none'; }

async function switchCam(id){
  try{
    sk=null; smoothBoxes.length=0;
    await startCameraById(id);
    curCamId=id;
    updateCamBtn();
  }catch(e){}
}

async function startCameraById(id){
  if(video.srcObject){ video.srcObject.getTracks().forEach(function(t){t.stop();}); }
  var stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:id},width:{ideal:1920},height:{ideal:1080}},audio:false});
  video.srcObject=stream;
  await video.play();
}

async function startCamera(){
  if(video.srcObject){ video.srcObject.getTracks().forEach(function(t){t.stop();}); }
  var stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
  video.srcObject=stream;
  await video.play();
  try{
    var st=stream.getVideoTracks()[0].getSettings();
    if(st && st.deviceId){ curCamId=st.deviceId; }
  }catch(e){}
}

startBtn.addEventListener('click', async function(){
  startBtn.disabled=true;
  startBtn.textContent='启动中...';
  try{
    await startCamera();
    startMask.style.display='none';
    bar.style.display='flex';
    running=true; lastT=performance.now(); requestAnimationFrame(loop);
    loadCams().then(updateCamBtn);
    updStatusLoad();
    preloadGroup(FILES.slice(0,4)).then(function(){
      loadPose();
    }).catch(function(){});
    preloadGroup(FILES.slice(4)).then(function(){
      DL.done=true;
      updStatusLoad();
      loadCoco();
    }).catch(function(){ DL.done=true; loadCoco(); });
  }catch(e){
    startBtn.textContent='重试';
    startBtn.disabled=false;
    startMsg.innerHTML='相机启动失败：请允许摄像头权限后重试';
  }
});

btnCam.addEventListener('click', openCamMenu);
camClose.addEventListener('click', closeCamMenu);
camSheet.addEventListener('click', function(e){ if(e.target===camSheet){ closeCamMenu(); } });

btnObj.addEventListener('click', function(){
  showObj=!showObj;
  btnObj.textContent='物体框 '+(showObj?'ON':'OFF');
  btnObj.className=showObj?'btn':'btn off';
  if(!showObj){ smoothBoxes.length=0; }
});

btnPose.addEventListener('click', function(){
  showPose=!showPose;
  btnPose.textContent='骨骼 '+(showPose?'ON':'OFF');
  btnPose.className=showPose?'btn':'btn off';
  if(!showPose){ sk=null; }
});

startBtn.disabled=false;
setTimeout(function(){ try{ if(!running){ startBtn.click(); } }catch(e){} }, 400);
});
