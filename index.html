<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AI LENS - Live Vision</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#05070a;overflow:hidden;font-family:Consolas,Menlo,monospace;}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#wrap{position:relative;}
video{display:block;max-width:100vw;max-height:100vh;}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;}
.hud{position:absolute;inset:0;pointer-events:none;}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(67,245,195,0.04) 0px,rgba(67,245,195,0.04) 1px,transparent 1px,transparent 5px);}
.corner{position:absolute;width:26px;height:26px;border:2px solid #43f5c3;}
.c1{left:6px;top:6px;border-right:none;border-bottom:none;}
.c2{right:6px;top:6px;border-left:none;border-bottom:none;}
.c3{left:6px;bottom:6px;border-right:none;border-top:none;}
.c4{right:6px;bottom:6px;border-left:none;border-top:none;}
.tag{position:absolute;left:14px;top:12px;font-size:12px;letter-spacing:2px;color:#43f5c3;}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#43f5c3;margin-right:8px;vertical-align:middle;}
.status{position:absolute;right:14px;top:12px;font-size:12px;letter-spacing:1px;color:#ffd166;}
.info{position:absolute;left:14px;bottom:12px;font-size:11px;letter-spacing:1px;color:#7fb8d8;}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:14px 12px 20px;background:linear-gradient(transparent,rgba(5,7,10,0.92));z-index:10;}
.btn{padding:12px 18px;border-radius:12px;border:1px solid rgba(67,245,195,0.5);background:rgba(5,7,10,0.6);color:#43f5c3;font-size:13px;font-family:inherit;letter-spacing:1px;}
.btn.off{opacity:0.45;border-color:#555;color:#888;}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#05070a;z-index:20;color:#43f5c3;padding:0 30px;}
#start h1{font-size:24px;letter-spacing:8px;font-weight:400;}
#start p{font-size:12px;color:#7fb8d8;letter-spacing:1px;text-align:center;line-height:2.2;}
#startBtn{padding:16px 46px;border-radius:999px;border:none;background:#43f5c3;color:#05070a;font-size:16px;font-weight:800;font-family:inherit;letter-spacing:4px;}
#startBtn[disabled]{opacity:0.4;}
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="scan"></div>
      <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
      <div class="tag"><span class="dot"></span><span id="tagText">AI LENS / STANDBY</span></div>
      <div class="status" id="status">BOOT...</div>
      <div class="info" id="info">COCO-SSD + MOVENET</div>
    </div>
  </div>
</div>
<div class="bar" id="bar" style="display:none;">
  <button class="btn" id="btnFlip">鍒囨崲闀滃ご</button>
  <button class="btn" id="btnObj">鐗╀綋妗?ON</button>
  <button class="btn" id="btnPose">楠ㄩ ON</button>
</div>
<div id="start">
  <h1>AI LENS</h1>
  <p>瀹炴椂鐩爣閿佸畾 + 浜虹墿楠ㄩ<br>棣栨浣跨敤闇€鍔犺浇 AI 妯″瀷锛堢害 20MB锛岃鐢?WiFi锛?/p>
  <button id="startBtn" disabled>鍚姩</button>
</div>
<script src="js/tf.min.js"></script>
<script src="js/coco-ssd.min.js"></script>
<script src="js/pose-detection.min.js"></script>
<script>
var video=document.getElementById('video');
var cv=document.getElementById('cv');
var ctx=cv.getContext('2d');
var statusEl=document.getElementById('status');
var infoEl=document.getElementById('info');
var tagText=document.getElementById('tagText');
var startMask=document.getElementById('start');
var startBtn=document.getElementById('startBtn');
var bar=document.getElementById('bar');
var btnFlip=document.getElementById('btnFlip');
var btnObj=document.getElementById('btnObj');
var btnPose=document.getElementById('btnPose');
var EDGES=[[0,1],[0,2],[1,3],[2,4],[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];
var COLORS={person:'#ff5a5f',bicycle:'#43f5c3',car:'#43f5c3',motorcycle:'#43f5c3',bus:'#ffd166',truck:'#ffd166',cup:'#9fe8ff',bottle:'#9fe8ff',laptop:'#c084fc',tv:'#c084fc',cell_phone:'#ffd166',chair:'#43f5c3',dining_table:'#43f5c3',keyboard:'#c084fc',mouse:'#c084fc',book:'#ffd166',backpack:'#ff5a5f',clock:'#c084fc',potted_plant:'#4ade80',vase:'#4ade80',remote:'#9fe8ff',scissors:'#ffd166',teddy_bear:'#ff5a5f'};
var coco=null, detector=null, modelsPromise=null;
var objects=[], poses=[];
var running=false;
var facing='environment';
var showObj=true, showPose=true;
var frame=0, lastT=0, fpsSmooth=0;

function hasVisible(p){
  if(!p||!p.keypoints){return false;}
  for(var i=0;i<p.keypoints.length;i++){ if(p.keypoints[i].score>0.3){return true;} }
  return false;
}

function draw(){
  if(video.videoWidth>0 && cv.width!==video.videoWidth){ cv.width=video.videoWidth; cv.height=video.videoHeight; }
  var w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  if(showObj){
    objects.forEach(function(b){
      var x=b.bbox[0],y=b.bbox[1],bw=b.bbox[2],bh=b.bbox[3];
      var color=COLORS[b.class]||'#43f5c3';
      ctx.strokeStyle=color;ctx.lineWidth=2;ctx.strokeRect(x,y,bw,bh);
      var cl=Math.min(18,bw*0.25,bh*0.25);
      ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,y+cl);ctx.lineTo(x,y);ctx.lineTo(x+cl,y);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+bw-cl,y);ctx.lineTo(x+bw,y);ctx.lineTo(x+bw,y+cl);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+bw,y+bh-cl);ctx.lineTo(x+bw,y+bh);ctx.lineTo(x+bw-cl,y+bh);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+cl,y+bh);ctx.lineTo(x,y+bh);ctx.lineTo(x,y+bh-cl);ctx.stroke();
      var text=(b.class==='cell_phone'?'phone':b.class)+' '+(b.score*100).toFixed(0)+'%';
      ctx.font='600 15px Consolas,monospace';
      var tw=ctx.measureText(text).width;
      ctx.fillStyle='rgba(5,7,10,0.78)';ctx.fillRect(x,y-24,tw+14,24);
      ctx.fillStyle=color;ctx.fillText(text,x+7,y-7);
    });
  }
  if(showPose){
    poses.forEach(function(p){
      var kp=p.keypoints;
      ctx.lineWidth=3.5;ctx.strokeStyle='#22f5ff';
      EDGES.forEach(function(e){
        var ka=kp[e[0]],kb=kp[e[1]];
        if(ka.score>0.3&&kb.score>0.3){ctx.beginPath();ctx.moveTo(ka.x,ka.y);ctx.lineTo(kb.x,kb.y);ctx.stroke();}
      });
      kp.forEach(function(k){
        if(k.score>0.3){ctx.beginPath();ctx.arc(k.x,k.y,4.5,0,6.2832);ctx.fillStyle='#ff3b6b';ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=1.5;ctx.stroke();}
      });
    });
  }
  var humanCount=0;
  poses.forEach(function(p){ if(hasVisible(p)){humanCount++;} });
  statusEl.textContent='TARGETS '+objects.length+' / HUMAN '+humanCount+' | '+Math.round(fpsSmooth)+' FPS';
}

async function loop(){
  frame++;
  var now=performance.now();
  var dt=now-lastT; lastT=now;
  if(dt>0){ var inst=1000/dt; fpsSmooth=fpsSmooth>0?fpsSmooth*0.9+inst*0.1:inst; }
  try{
    if(showPose && frame%2===0){ poses=await detector.estimatePoses(video); }
    if(showObj && frame%3===0){ objects=await coco.detect(video); }
  }catch(e){}
  draw();
  if(running){ requestAnimationFrame(loop); }
}

async function startCamera(){
  if(video.srcObject){ video.srcObject.getTracks().forEach(function(t){t.stop();}); }
  var stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;
  await video.play();
}

function ensureModels(){
  if(!modelsPromise){
    modelsPromise=Promise.all([
      cocoSsd.load({base:'lite_mobilenet_v2',modelUrl:'./models/coco-ssd-lite/model.json'}),
      poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,modelUrl:'./models/movenet/model.json'})
    ]).then(function(r){ coco=r[0]; detector=r[1]; });
  }
  return modelsPromise;
}

startBtn.addEventListener('click', async function(){
  startBtn.disabled=true;
  startMask.querySelector('p').innerHTML='姝ｅ湪鍔犺浇 AI 妯″瀷锛堥娆＄害 20MB锛?..<br>璇风◢鍊欙紝骞跺厑璁告憚鍍忓ご鏉冮檺';
  try{
    await Promise.all([ensureModels(), startCamera()]);
    startMask.style.display='none';
    bar.style.display='flex';
    tagText.textContent='AI LENS / LIVE';
    var bk=''; try{ bk=tf.getBackend()||''; }catch(e){}
    infoEl.textContent='COCO-SSD + MOVENET // '+bk.toUpperCase();
    running=true; lastT=performance.now(); requestAnimationFrame(loop);
  }catch(e){
    startMask.querySelector('p').innerHTML='鍚姩澶辫触锛?+(e&&e.message?e.message:e)+'<br>璇峰厑璁告憚鍍忓ご鏉冮檺鍚庨噸璇?;
    startBtn.textContent='閲嶈瘯';
    startBtn.disabled=false;
  }
});

btnFlip.addEventListener('click', async function(){
  facing = facing==='environment' ? 'user' : 'environment';
  try{ await startCamera(); }catch(e){}
});

btnObj.addEventListener('click', function(){
  showObj=!showObj;
  btnObj.textContent='鐗╀綋妗?'+(showObj?'ON':'OFF');
  btnObj.className=showObj?'btn':'btn off';
  if(!showObj){ objects=[]; }
});

btnPose.addEventListener('click', function(){
  showPose=!showPose;
  btnPose.textContent='楠ㄩ '+(showPose?'ON':'OFF');
  btnPose.className=showPose?'btn':'btn off';
  if(!showPose){ poses=[]; }
});

startBtn.disabled=false;
setTimeout(function(){ try{ if(!running){ startBtn.click(); } }catch(e){} }, 500);
</script>
</body>
</html>
