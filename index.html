<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>AI LENS</title>
<style>
:root{--g1:rgba(255,255,255,.14);--g2:rgba(255,255,255,.06);--bd:rgba(255,255,255,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
#app{position:fixed;inset:0;background:#000;overflow:hidden}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;opacity:.01;z-index:0;pointer-events:none}
#cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;transform-origin:center center;background:#000;z-index:1}
.top{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;z-index:20;gap:6px;pointer-events:none}
.tag{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;font-size:10px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));border:1px solid var(--bd);backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 18px rgba(0,0,0,.25);max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:#4be38b;box-shadow:0 0 8px #4be38b;flex:none}
#startMask{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:60;background:radial-gradient(circle at 30% 20%,#5b7cfa 0%,#8b5cf6 35%,#d946ef 75%,#f472b6 100%)}
.card{width:82%;max-width:340px;padding:26px 20px 22px;border-radius:26px;text-align:center;color:#fff;background:linear-gradient(150deg,rgba(255,255,255,.22),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.38);backdrop-filter:blur(30px) saturate(2);-webkit-backdrop-filter:blur(30px) saturate(2);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 20px 50px rgba(0,0,0,.3)}
.brand{font-size:26px;letter-spacing:8px;font-weight:300;margin-bottom:12px}
.sub{font-size:12.5px;opacity:.92;line-height:1.7}
.sub2{font-size:11.5px;opacity:.8;margin-top:6px}
#progWrap{height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:16px 0 4px;overflow:hidden}
#progBar{height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#fff,#c4b5fd);transition:width .25s}
.btn{border:none;outline:none;font-size:11px;color:#fff;padding:8px 14px;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,var(--g1),var(--g2));backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px rgba(0,0,0,.22);transition:transform .12s;white-space:nowrap;border:1px solid var(--bd)}
.btn:active{transform:scale(.94)}
.btn.primary{background:linear-gradient(135deg,rgba(139,92,246,.95),rgba(217,70,239,.9));border-color:rgba(255,255,255,.4)}
.btn.off{opacity:.48}
.btn.big{width:100%;padding:12px;margin-top:14px;font-size:13.5px;border-radius:16px;letter-spacing:2px}
.btn.rec{background:linear-gradient(135deg,rgba(239,68,68,.95),rgba(220,38,38,.9));border-color:rgba(255,255,255,.45)}
.info{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));font-size:10px;color:#fff;padding:5px 12px;border-radius:999px;max-width:92%;text-align:center;background:linear-gradient(135deg,var(--g1),var(--g2));border:1px solid var(--bd);backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:20}
.ctrl{position:absolute;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:5px;justify-content:center;z-index:30}
.ctrl .btn{flex:1;padding:9px 4px;font-size:10px;text-align:center;min-width:0}
#camMenu{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));width:min(88%,330px);padding:14px;border-radius:22px;display:none;z-index:40;color:#fff;background:linear-gradient(150deg,rgba(255,255,255,.24),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(34px) saturate(2);-webkit-backdrop-filter:blur(34px) saturate(2);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 18px 44px rgba(0,0,0,.35)}
#camMenu.show{display:block}
.menuTitle{font-size:12px;opacity:.9;margin-bottom:10px;letter-spacing:1px}
#camList{display:flex;flex-direction:column;gap:7px;max-height:180px;overflow:auto}
.camItem{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;padding:9px 12px;border-radius:13px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.16);cursor:pointer}
.camItem:active{background:rgba(255,255,255,.24)}
.camItem .id{opacity:.5;font-size:9.5px;margin-left:8px}
.zoomRow{display:flex;gap:7px;margin-top:10px}
.zbtn{flex:1;padding:8px;border-radius:12px;font-size:11.5px;color:#fff;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.12);cursor:pointer}
.zbtn.on{background:linear-gradient(135deg,rgba(139,92,246,.95),rgba(217,70,239,.9));border-color:rgba(255,255,255,.4)}
</style>

<body>
<div id="app">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="cv"></canvas>
  <div class="top">
    <div class="tag"><span class="dot" id="dotL"></span><span id="tagLText">AI LENS / LIVE</span></div>
    <div class="tag" id="tagR">初始化</div>
  </div>
  <div id="startMask">
    <div class="card">
      <div class="brand">AI LENS</div>
      <div class="sub">实时目标识别 + 多人骨骼</div>
      <div class="sub2" id="startMsg">点一下启动，边扫边加载</div>
      <div id="progWrap"><div id="progBar"></div></div>
      <button id="startBtn" class="btn primary big">启动</button>
    </div>
  </div>
  <div class="info" id="info">就绪</div>
  <div class="ctrl">
    <button class="btn" id="btnCam">后置</button>
    <button class="btn" id="btnObj">物体 ON</button>
    <button class="btn" id="btnPose">骨骼 ON</button>
    <button class="btn" id="btnShot">拍照</button>
    <button class="btn" id="btnRec">录制</button>
  </div>
  <div id="camMenu">
    <div class="menuTitle" id="menuTitle">选择镜头</div>
    <div id="camList"></div>
    <div class="zoomRow" id="zoomRow">
      <button class="zbtn on" data-z="1">1x</button>
      <button class="zbtn" data-z="2">2x</button>
      <button class="zbtn" data-z="3">3x</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
var video=document.getElementById('video');
var cv=document.getElementById('cv');
var ctx=cv.getContext('2d');
var startMask=document.getElementById('startMask');
var startBtn=document.getElementById('startBtn');
var startMsg=document.getElementById('startMsg');
var progBar=document.getElementById('progBar');
var tagR=document.getElementById('tagR');
var info=document.getElementById('info');
var btnCam=document.getElementById('btnCam');
var btnObj=document.getElementById('btnObj');
var btnPose=document.getElementById('btnPose');
var btnShot=document.getElementById('btnShot');
var btnRec=document.getElementById('btnRec');
var camMenu=document.getElementById('camMenu');
var camList=document.getElementById('camList');
var menuTitle=document.getElementById('menuTitle');
var zoomRow=document.getElementById('zoomRow');

var running=false, facing='environment', curCamId=null, camName='后置';
var objOn=true, poseOn=true, zoomVal=1;
var objModel=null, poseModel=null, objReady=false, poseReady=false;
var objTracks=[], globalKp=null, globalStrikes=0, trackSeq=1;
var objBusy=false, objTick=0;
var recording=false, recorder=null, recChunks=[], recT0=0, recCanvas=null, recCtx=null;
var cropC=null, cropCtx=null, poseC=null, poseCtx=null;
var fpsCnt=0, fpsT0=0, fpsVal=0;
var loopsStarted=false, noPicFrames=0;

var CBASES=[
'https://gcore.jsdelivr.net/gh/tayyh19/ai-lens@1d341c29e30488f7f640f872540284a960a400cf',
'https://testingcf.jsdelivr.net/gh/tayyh19/ai-lens@1d341c29e30488f7f640f872540284a960a400cf',
'https://fastly.jsdelivr.net/gh/tayyh19/ai-lens@1d341c29e30488f7f640f872540284a960a400cf',
'https://gh-proxy.com/https://raw.githubusercontent.com/tayyh19/ai-lens/1d341c29e30488f7f640f872540284a960a400cf',
'https://ghproxy.net/https://raw.githubusercontent.com/tayyh19/ai-lens/1d341c29e30488f7f640f872540284a960a400cf'];

var MODEL_FILES=[
'models/coco-ssd-lite/model.json',
'models/coco-ssd-lite/group1-shard1of4',
'models/coco-ssd-lite/group1-shard2of4',
'models/coco-ssd-lite/group1-shard3of4',
'models/coco-ssd-lite/group1-shard4of4',
'models/movenet-thunder/model.json',
'models/movenet-thunder/group1-shard1of3',
'models/movenet-thunder/group1-shard2of3',
'models/movenet-thunder/group1-shard3of3'];

function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

function waitPlay(v, timeoutMs){
  return new Promise(function(resolve,reject){
    var done=false;
    var timer=setTimeout(function(){ if(!done){ done=true; reject(new Error('PLAY_TIMEOUT')); } }, timeoutMs||6000);
    function fin(err){ if(done){return;} done=true; clearTimeout(timer); if(err){reject(err);}else{resolve();} }
    v.onloadedmetadata=function(){ fin(null); };
    var p=v.play();
    if(p&&p.then){ p.then(function(){ fin(null); }).catch(function(e){ fin(e); }); }
    else { fin(null); }
  });
}
function openStream(constraints){
  return new Promise(function(resolve,reject){
    var done=false;
    var timer=setTimeout(function(){ if(!done){ done=true; reject(new Error('CAM_TIMEOUT')); } }, 12000);
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ clearTimeout(timer); reject(new Error('NO_MEDIA_API')); return; }
    navigator.mediaDevices.getUserMedia(constraints).then(function(stream){
      if(!done){ done=true; clearTimeout(timer); resolve(stream); }
      else { stream.getTracks().forEach(function(t){t.stop();}); }
    }).catch(function(e){
      if(!done){ done=true; clearTimeout(timer); reject(e); }
    });
  });
}
async function startCamera(){
  if(video.srcObject){ video.srcObject.getTracks().forEach(function(t){t.stop();}); video.srcObject=null; }
  var stream=await openStream({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:30}},audio:false});
  video.srcObject=stream;
  try{ await waitPlay(video,6000); }catch(e){}
  try{
    var st=stream.getVideoTracks()[0].getSettings();
    if(st&&st.deviceId){ curCamId=st.deviceId; }
  }catch(e){}
}

function loadScriptOnce(path){
  return new Promise(function(resolve,reject){
    var i=0;
    function tryNext(){
      if(i>=CBASES.length){ reject(new Error('LIB_FAIL')); return; }
      var s=document.createElement('script');
      s.src=CBASES[i++]+'/'+path;
      s.onload=function(){ resolve(); };
      s.onerror=function(){ try{ s.remove(); }catch(e){} tryNext(); };
      document.head.appendChild(s);
    }
    tryNext();
  });
}

async function preloadAll(){
  var results={};
  var total=MODEL_FILES.length, done=0, idx=0;
  function bump(){ done++; var pc=Math.round(done/total*100); try{ progBar.style.width=pc+'%'; }catch(e){} tagR.textContent='加载 '+pc+'%'; }
  var first=await (async function(){
    for(var k=0;k<CBASES.length;k++){
      try{
        var ctl0=new AbortController();
        var t0=setTimeout(function(){ try{ ctl0.abort(); }catch(e){} }, 9000);
        try{
          var r=await fetch(CBASES[k]+'/models/coco-ssd-lite/model.json',{cache:'force-cache',signal:ctl0.signal});
          if(r.ok){ await r.blob(); clearTimeout(t0); return CBASES[k]; }
        }catch(e){}
        clearTimeout(t0);
      }catch(e){}
    }
    return null;
  })();
  var order=[];
  if(first){
    order.push(first);
    CBASES.forEach(function(b){ if(b!==first) order.push(b); });
  } else {
    order=CBASES.slice();
  }
  var nW=3;
  var workers=[];
  for(var w=0;w<nW;w++){
    workers.push((async function(){
      while(true){
        var my=idx++; if(my>=total) return;
        var p=MODEL_FILES[my];
        var found=null;
        for(var k=0;k<order.length;k++){
          try{
            var url=order[(my+k)%order.length]+'/'+p;
            var ctl=new AbortController();
            var tid=setTimeout(function(){ try{ ctl.abort(); }catch(e){} }, 9000);
            try{
              var resp=await fetch(url,{cache:'force-cache',signal:ctl.signal});
              if(resp.ok){ await resp.blob(); found=url; }
            }catch(e){}
            clearTimeout(tid);
            if(found){ break; }
          }catch(e){}
        }
        results[p]=found;
        bump();
      }
    })());
  }
  await Promise.all(workers);
  try{ progBar.style.width='100%'; }catch(e){}
  return results;
}

async function boot(){
  tagR.textContent='加载引擎';
  try{
    await loadScriptOnce('js/tf.min.js');
    await loadScriptOnce('js/coco-ssd.min.js');
    await loadScriptOnce('js/pose-detection.min.js');
  }catch(e){ tagR.textContent='引擎加载失败'; return; }
  tagR.textContent='加载模型 0%';
  var res=await preloadAll();
  tagR.textContent='初始化模型';
  if(window.cocoSsd){
    try{
      var ou=res['models/coco-ssd-lite/model.json'];
      if(ou){ objModel=await cocoSsd.load({base:'lite_mobilenet_v2', modelUrl:ou}); objReady=true; }
    }catch(e){}
  }
  updateButtons();
  if(window.poseDetection&&window.tf){
    try{
      var pu=res['models/movenet-thunder/model.json'];
      if(pu){
        poseModel=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.SINGLEPOSE_THUNDER, modelUrl:pu});
        poseReady=true;
      }
    }catch(e){}
  }
  updateButtons();
  updateInfo();
  if(!objReady&&!poseReady){ info.textContent='模型加载失败，请刷新重试'; }
}

function updateButtons(){
  btnObj.textContent='物体 '+(objReady?(objOn?'ON':'OFF'):'…');
  btnObj.classList.toggle('off',!objReady||!objOn);
  btnPose.textContent='骨骼 '+(poseReady?(poseOn?'ON':'OFF'):'…');
  btnPose.classList.toggle('off',!poseReady||!poseOn);
}
function updateInfo(){
  var vw=video.videoWidth||0, vh=video.videoHeight||0;
  info.textContent='镜头 '+camName+' · '+vw+'x'+vh+' · 变焦 '+zoomVal+'x';
}
function updateStatus(){
  var pc=0;
  for(var i=0;i<objTracks.length;i++){ if(objTracks[i].kp) pc++; }
  if(globalKp) pc=Math.max(pc,1);
  var txt='物'+objTracks.length+' · 人'+pc+' · '+fpsVal+'fps';
  if(recording){ txt='REC '+((performance.now()-recT0)/1000).toFixed(1)+'s · '+txt; }
  tagR.textContent=txt;
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

var SKEL=[[0,1],[0,2],[1,3],[2,4],[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];

function drawBox(t){
  var vw=cv.width||1280;
  var S=vw/1280; if(S<1){ S=1; }
  var b=t.b;
  ctx.strokeStyle='rgba(94,234,212,.95)';
  ctx.lineWidth=Math.max(2,2.4*S);
  ctx.shadowColor='rgba(0,0,0,.5)';
  ctx.shadowBlur=6*S;
  ctx.strokeRect(b.x,b.y,b.w,b.h);
  ctx.shadowBlur=0;
  var label=t.cls+' '+Math.round(t.conf*100)+'%';
  ctx.font=Math.round(11*S)+'px -apple-system,sans-serif';
  var tw=ctx.measureText(label).width;
  var th=Math.round(15*S);
  var lx=b.x, ly=b.y-th-2*S;
  if(ly<0){ ly=b.y+2*S; }
  ctx.fillStyle='rgba(10,40,40,.72)';
  roundRect(lx,ly,tw+9*S,th,4*S);
  ctx.fill();
  ctx.fillStyle='#7ef3dd';
  ctx.textBaseline='middle';
  ctx.fillText(label, lx+4.5*S, ly+th/2);
}

function drawPose(kp){
  if(!kp||kp.length<17) return;
  var vw=cv.width||1280;
  var S=vw/1280; if(S<1){ S=1; }
  ctx.strokeStyle='rgba(96,165,250,.95)';
  ctx.lineWidth=Math.max(2,2.2*S);
  ctx.lineCap='round';
  for(var i=0;i<SKEL.length;i++){
    var a=kp[SKEL[i][0]], b=kp[SKEL[i][1]];
    if(!a||!b) continue;
    if((a.score||0)<0.3||(b.score||0)<0.3) continue;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  for(var j=0;j<kp.length;j++){
    var k=kp[j];
    if(!k||(k.score||0)<0.35) continue;
    ctx.beginPath();
    ctx.arc(k.x,k.y,Math.max(2.5,3*S),0,Math.PI*2);
    ctx.fillStyle='rgba(147,197,253,.95)';
    ctx.fill();
  }
}

function render(){
  requestAnimationFrame(render);
  if(!running) return;
  var vw=video.videoWidth||0, vh=video.videoHeight||0;
  if(vw>0&&vh>0&&(cv.width!==vw||cv.height!==vh)){ cv.width=vw; cv.height=vh; updateInfo(); }
  if(vw>0&&vh>0){ try{ ctx.drawImage(video,0,0,cv.width,cv.height); }catch(e){ ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height); } }
  else { ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height); }
  if(running&&vw===0){ noPicFrames++; if(noPicFrames===90){ info.textContent='摄像头无画面：可能被其他应用占用，请刷新重试'; } } else { noPicFrames=0; }
  if(objOn){
    for(var i=0;i<objTracks.length;i++){
      var t=objTracks[i];
      if(t.hit>=2||t.conf>0.5) drawBox(t);
    }
  }
  if(poseOn){
    for(var j=0;j<objTracks.length;j++){ if(objTracks[j].kp) drawPose(objTracks[j].kp); }
    if(globalKp) drawPose(globalKp);
  }
  if(recording){
    btnRec.textContent='停 '+((performance.now()-recT0)/1000).toFixed(1)+'s';
  }
  requestAnimationFrame(function(){});
}

function countFrame(){
  fpsCnt++;
  var el=performance.now()-fpsT0;
  if(el>=500){ fpsVal=Math.round(fpsCnt*1000/el); fpsCnt=0; fpsT0=performance.now(); updateStatus(); }
  scheduleFrame();
}
function scheduleFrame(){
  if(video.requestVideoFrameCallback){ video.requestVideoFrameCallback(countFrame); }
  else { requestAnimationFrame(countFrame); }
}

function iouOf(a,b){
  var x1=Math.max(a.x,b.x), y1=Math.max(a.y,b.y);
  var x2=Math.min(a.x+a.w,b.x+b.w), y2=Math.min(a.y+a.h,b.y+b.h);
  var iw=x2-x1, ih=y2-y1;
  if(iw<=0||ih<=0) return 0;
  var inter=iw*ih;
  var uni=a.w*a.h+b.w*b.h-inter;
  return uni>0?inter/uni:0;
}

var TILES=[];
(function(){ for(var ty=0;ty<3;ty++){ for(var tx=0;tx<3;tx++){ TILES.push([tx/3, ty/3, 1/3, 1/3]); } } })();
var tileC=null, tileCtx=null;
function tileCrop(t){
  if(!tileC){ tileC=document.createElement('canvas'); tileC.width=320; tileC.height=320; tileCtx=tileC.getContext('2d'); }
  var vw=video.videoWidth||1280, vh=video.videoHeight||720;
  var tx=t[0]*vw, ty=t[1]*vh, tw=t[2]*vw, th=t[3]*vh;
  tileCtx.drawImage(video,tx,ty,tw,th,0,0,320,320);
  return {canvas:tileC, ox:tx, oy:ty, sx:tw/320, sy:th/320};
}
function tileMap(b,m){ return {x:m.ox+b[0]*m.sx, y:m.oy+b[1]*m.sy, w:b[2]*m.sx, h:b[3]*m.sy}; }
function identityMap(b){ return {x:b[0],y:b[1],w:b[2],h:b[3]}; }

function mergePreds(preds, mapFn, minScore){
  minScore=(typeof minScore==='number')?minScore:0.22;
  var used={};
  var i, p, b;
  for(var pi=0;pi<preds.length;pi++){
    p=preds[pi];
    if(!p||!p.bbox) continue;
    if(p.score<minScore) continue;
    b=mapFn(p.bbox);
    if(!b) continue;
    if(p.class==='person'&&p.score<0.28) continue;
    if(b.w<4||b.h<4) continue;
    var bi=-1, biou=0.3;
    for(i=0;i<objTracks.length;i++){
      if(used[i]||objTracks[i].cls!==p.class) continue;
      var iou=iouOf(b,objTracks[i].b);
      if(iou>biou){ bi=i; biou=iou; }
    }
    if(bi>=0){
      used[bi]=true;
      var t=objTracks[bi];
      t.b={x:t.b.x*0.55+b.x*0.45, y:t.b.y*0.55+b.y*0.45, w:t.b.w*0.55+b.w*0.45, h:t.b.h*0.55+b.h*0.45};
      t.conf=p.score; t.miss=0; t.hit=Math.min(10,t.hit+1);
    } else {
      objTracks.push({id:trackSeq++, cls:p.class, b:b, conf:p.score, miss:0, hit:1, born:performance.now(), kp:null, strikes:0});
    }
  }
  for(var pj=0;pj<preds.length;pj++){
    var q=preds[pj];
    if(!q||!q.bbox) continue;
    if(q.score>=minScore) continue;
    if(q.score<0.12) continue;
    var b2=mapFn(q.bbox);
    if(!b2) continue;
    for(i=0;i<objTracks.length;i++){
      if(used[i]||objTracks[i].cls!==q.class) continue;
      if(iouOf(b2,objTracks[i].b)>0.35){
        used[i]=true;
        objTracks[i].b={x:objTracks[i].b.x*0.6+b2.x*0.4, y:objTracks[i].b.y*0.6+b2.y*0.4, w:objTracks[i].b.w*0.6+b2.w*0.4, h:objTracks[i].b.h*0.6+b2.h*0.4};
        objTracks[i].miss=0;
        break;
      }
    }
  }
  for(var k=0;k<objTracks.length;k++){ if(!used[k]) objTracks[k].miss++; }
  var now=performance.now();
  var dedup=[];
  for(var da=0;da<objTracks.length;da++){
    var ta=objTracks[da];
    var dup=false;
    for(var db=0;db<dedup.length;db++){
      if(dedup[db].cls!==ta.cls) continue;
      if(iouOf(ta.b,dedup[db].b)>0.45){
        dup=true;
        if(ta.conf>dedup[db].conf){ dedup[db]=ta; }
        break;
      }
    }
    if(!dup) dedup.push(ta);
  }
  objTracks=dedup;
  var out=[];
  for(var m=0;m<objTracks.length;m++){
    var tr=objTracks[m];
    if(tr.miss>=4) continue;
    var age=now-tr.born;
    if(tr.hit<2&&tr.conf<0.5&&age<700) continue;
    out.push(tr);
  }
  objTracks=out;
}

async function objLoop(){
  var tileIdx=0;
  while(true){
    if(!running||!objOn||!objReady||video.readyState<2){ await sleep(180); continue; }
    if(objBusy){ await sleep(40); continue; }
    objBusy=true;
    try{
      var phase=objTick%10;
      objTick++;
      if(phase===0){
        var preds=await objModel.detect(video,20);
        if(preds) mergePreds(preds, identityMap, 0.18);
      } else {
        var tp=TILES[tileIdx%TILES.length];
        tileIdx++;
        var m=tileCrop(tp);
        var preds2=await objModel.detect(m.canvas,20);
        if(preds2){
          var mf=(function(mm){ return function(bb){
            var r=tileMap(bb,mm);
            var cxx=r.x+r.w/2, cyy=r.y+r.h/2;
            var tw=mm.sx*320, th=mm.sy*320;
            if(cxx<mm.ox+tw*0.12||cxx>mm.ox+tw*0.88) return null;
            if(cyy<mm.oy+th*0.12||cyy>mm.oy+th*0.88) return null;
            return r;
          }; })(m);
          mergePreds(preds2, mf, 0.10);
        }
      }
    }catch(e){}
    objBusy=false;
    await sleep(20);
  }
}

function coreOk(kp){
  if(!kp||kp.length<17) return false;
  var nose=kp[0], ls=kp[5], rs=kp[6], lh=kp[11], rh=kp[12];
  if(nose&&nose.score>0.4) return true;
  if(ls&&rs&&ls.score>0.35&&rs.score>0.35) return true;
  if(lh&&rh&&lh.score>0.35&&rh.score>0.35) return true;
  return false;
}
function smoothKp(prev,cur){
  if(!prev||prev.length!==cur.length) return cur;
  var out=[];
  var w=0.42;
  for(var i=0;i<cur.length;i++){
    var a=prev[i], b=cur[i];
    if(!b){ out.push(a); continue; }
    if(!a){ out.push(b); continue; }
    out.push({x:a.x*(1-w)+b.x*w, y:a.y*(1-w)+b.y*w, score:b.score});
  }
  return out;
}

async function detectPoseInBox(b){
  if(!poseModel) return null;
  var vw=video.videoWidth||1280, vh=video.videoHeight||720;
  var pad=0.18;
  var x=Math.max(0,b.x-b.w*pad), y=Math.max(0,b.y-b.h*pad);
  var w=Math.min(vw-x,b.w*(1+pad*2)), h=Math.min(vh-y,b.h*(1+pad*2));
  if(w<16||h<16) return null;
  var cw=Math.min(320,Math.round(w)), ch=Math.round(cw*h/w);
  if(ch<16) return null;
  if(!poseC){ poseC=document.createElement('canvas'); poseC.width=cw; poseC.height=ch; poseCtx=poseC.getContext('2d'); }
  if(poseC.width!==cw||poseC.height!==ch){ poseC.width=cw; poseC.height=ch; }
  poseCtx.drawImage(video,x,y,w,h,0,0,cw,ch);
  var res=await poseModel.estimatePoses(poseC);
  if(!res||!res.length) return null;
  var kps=res[0].keypoints;
  if(!kps||!kps.length) return null;
  var out=[];
  for(var i=0;i<kps.length;i++){
    var kk=kps[i];
    out.push({x:x+kk.x*w/cw, y:y+kk.y*h/ch, score:kk.score});
  }
  return out;
}

async function poseLoop(){
  while(true){
    if(!running||!poseOn||!poseReady||video.readyState<2){ await sleep(180); continue; }
    try{
      if(objReady&&objOn){
        var ps=[];
        for(var i=0;i<objTracks.length;i++){ if(objTracks[i].cls==='person') ps.push(objTracks[i]); }
        if(!ps.length){ await sleep(90); continue; }
        for(var j=0;j<ps.length;j++){
          var t=ps[j];
          var kp=await detectPoseInBox(t.b);
          if(kp){
            if(coreOk(kp)){ t.kp=smoothKp(t.kp,kp); t.strikes=0; }
            else { t.strikes=(t.strikes||0)+1; if(t.strikes>=3){ t.kp=null; } }
          } else {
            t.strikes=(t.strikes||0)+1;
            if(t.strikes>=6){ t.kp=null; }
          }
          await sleep(8);
        }
      } else {
        var res=await poseModel.estimatePoses(video);
        if(res&&res.length&&res[0].keypoints){
          var k=res[0].keypoints;
          if(coreOk(k)){ globalKp=smoothKp(globalKp,k); globalStrikes=0; }
          else { globalStrikes++; if(globalStrikes>=3){ globalKp=null; } }
        } else {
          globalStrikes++;
          if(globalStrikes>=4){ globalKp=null; }
        }
      }
    }catch(e){}
    await sleep(20);
  }
}

function setZoom(z){
  zoomVal=z;
  cv.style.transform='scale('+z+')';
  var bs=zoomRow.querySelectorAll('.zbtn');
  for(var i=0;i<bs.length;i++){ bs[i].classList.toggle('on',Number(bs[i].getAttribute('data-z'))===z); }
  updateInfo();
}

function shortName(lbl){
  if(!lbl) return '镜头';
  var s=lbl.split('(')[0].trim();
  if(s.length>10) s=s.slice(0,10);
  return s;
}

async function switchCam(id,name){
  try{
    if(video.srcObject){ video.srcObject.getTracks().forEach(function(t){t.stop();}); video.srcObject=null; }
    var stream=await openStream({video:{deviceId:{exact:id},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:30}},audio:false});
    video.srcObject=stream;
    try{ await waitPlay(video,6000); }catch(e){}
    curCamId=id; camName=shortName(name);
    btnCam.textContent=camName;
    objTracks=[]; globalKp=null;
    setZoom(1);
  }catch(e){ info.textContent='切换镜头失败'; }
}

function takeShot(){
  if(!running) return;
  if(!cv.width||!cv.height){ info.textContent='画面未就绪'; return; }
  try{
    cv.toBlob(function(blob){
      if(!blob){ info.textContent='拍照失败'; return; }
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='ai-lens-'+Date.now()+'.png';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); },6000);
      info.textContent='已拍照保存';
    },'image/png');
  }catch(e){ info.textContent='拍照失败'; }
}

function toggleRec(){
  if(!running) return;
  if(recording){
    try{ recorder.stop(); }catch(e){}
    recording=false;
    btnRec.classList.remove('rec');
    btnRec.textContent='录制';
    info.textContent='录制已保存';
    return;
  }
  if(!window.MediaRecorder){ info.textContent='浏览器不支持录制'; return; }
  try{
    recChunks=[];
    var stream=cv.captureStream(30);
    var mt='video/webm;codecs=vp8';
    if(!MediaRecorder.isTypeSupported(mt)){
      mt='video/webm';
      if(!MediaRecorder.isTypeSupported(mt)){ mt=''; }
    }
    var opts={videoBitsPerSecond:2500000};
    if(mt){ opts.mimeType=mt; }
    recorder=new MediaRecorder(stream,opts);
    recorder.ondataavailable=function(e){ if(e.data&&e.data.size>0) recChunks.push(e.data); };
    recorder.onstop=function(){
      try{
        if(!recChunks.length){ info.textContent='录制为空'; return; }
        var blob=new Blob(recChunks,{type:'video/webm'});
        var a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download='ai-lens-'+Date.now()+'.webm';
        a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); },10000);
      }catch(e){}
    };
    recorder.start(500);
    recording=true; recT0=performance.now();
    btnRec.classList.add('rec');
    btnRec.textContent='停 0.0s';
    info.textContent='录制中（带识别标注）';
  }catch(e){ info.textContent='录制启动失败'; }
}

startBtn.addEventListener('click', async function(){
  if(running) return;
  startBtn.disabled=true;
  startBtn.textContent='启动中…';
  startMsg.textContent='正在打开摄像头…';
  try{
    await startCamera();
    var wf=0;
    while(video.videoWidth===0&&wf<3000){ await sleep(100); wf+=100; }
    try{ video.play(); }catch(e){}
    startMask.style.display='none';
    running=true;
    tagR.textContent='加载引擎';
    if(!loopsStarted){ loopsStarted=true; objLoop(); poseLoop(); render(); scheduleFrame(); }
    boot();
  }catch(e){
    startBtn.disabled=false;
    startBtn.textContent='重试';
    var emsg='相机启动失败';
    try{
      var en=(e&&e.name)?e.name:'';
      var em=(e&&e.message)?e.message:'';
      if(en==='NotAllowedError'){ emsg='摄像头权限被拒绝：请在浏览器/系统设置里允许摄像头后点重试'; }
      else if(en==='NotFoundError'){ emsg='未找到摄像头'; }
      else if(en==='NotReadableError'){ emsg='摄像头被占用：请关闭相机等应用后点重试'; }
      else if(en==='OverconstrainedError'){ emsg='摄像头不支持该配置'; }
      else if(em==='CAM_TIMEOUT'){ emsg='摄像头启动超时：请点重试'; }
      else if(em==='PLAY_TIMEOUT'){ emsg='画面加载超时：请点重试'; }
      else if(em==='NO_MEDIA_API'){ emsg='浏览器不支持摄像头API：请用系统浏览器或Chrome打开'; }
      else if(en&&en!=='Error'){ emsg='启动失败：'+en; }
      else if(em){ emsg='启动失败：'+em; }
    }catch(x){}
    startMsg.innerHTML=emsg;
  }
});

btnObj.addEventListener('click', function(){ objOn=!objOn; if(!objOn){ objTracks=[]; } updateButtons(); });
btnPose.addEventListener('click', function(){ poseOn=!poseOn; if(!poseOn){ globalKp=null; for(var i=0;i<objTracks.length;i++){ objTracks[i].kp=null; } } updateButtons(); });
btnShot.addEventListener('click', takeShot);
btnRec.addEventListener('click', toggleRec);

btnCam.addEventListener('click', async function(){
  try{
    var devs=await navigator.mediaDevices.enumerateDevices();
    var vids=[];
    for(var i=0;i<devs.length;i++){ if(devs[i].kind==='videoinput') vids.push(devs[i]); }
    if(!vids.length){ info.textContent='未发现摄像头'; return; }
    camList.innerHTML='';
    vids.forEach(function(d,idx){
      var div=document.createElement('div');
      div.className='camItem';
      var nm=d.label||('镜头 '+(idx+1));
      var sp1=document.createElement('span');
      sp1.textContent=nm;
      var sp2=document.createElement('span');
      sp2.className='id';
      sp2.textContent=(d.deviceId||'').slice(0,6);
      div.appendChild(sp1); div.appendChild(sp2);
      div.addEventListener('click', function(){
        camMenu.classList.remove('show');
        switchCam(d.deviceId, nm);
      });
      camList.appendChild(div);
    });
    menuTitle.textContent='选择镜头（共 '+vids.length+' 个）';
    camMenu.classList.add('show');
  }catch(e){ info.textContent='读取镜头失败'; }
});

zoomRow.addEventListener('click', function(e){
  var el=e.target;
  while(el&&el!==zoomRow&&!el.getAttribute){ el=el.parentNode; }
  if(!el||el===zoomRow) return;
  var z=el.getAttribute&&el.getAttribute('data-z');
  if(z){ setZoom(Number(z)); }
});

document.addEventListener('click', function(e){
  if(!camMenu.classList.contains('show')) return;
  if(camMenu.contains(e.target)) return;
  camMenu.classList.remove('show');
});

window.addEventListener('pagehide', function(){
  try{ if(video.srcObject){ video.srcObject.getTracks().forEach(function(t){t.stop();}); } }catch(e){}
});

setZoom(1);
fpsT0=performance.now();
})();
</script>
