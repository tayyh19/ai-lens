<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#05070a">
<title>AI LENS</title>
<script>
(function(){
  var ASSETS=[];
  var origFetch=window.fetch?window.fetch.bind(window):null;
  function matchAsset(u){
    if(!u||!ASSETS.length){return null;}
    for(var i=0;i<ASSETS.length;i++){
      if(u.indexOf(ASSETS[i].rel)>=0){return ASSETS[i];}
    }
    return null;
  }
  if(origFetch){
    window.fetch=function(input,init){
      try{
        var u=(typeof input==='string')?input:((input&&input.url)||'');
        var hit=matchAsset(u);
        if(hit){return Promise.resolve(new Response(hit.buf,{status:200,headers:{'Content-Type':hit.ct||'application/octet-stream'}}));}
      }catch(e){}
      return origFetch(input,init);
    };
  }
  window.__AI_LENS={ASSETS:ASSETS,origFetch:origFetch};
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#05070a;overflow:hidden;font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05070a;}
#wrap{position:relative;}
video{display:block;max-width:100vw;max-height:100vh;}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;}
.hud{position:absolute;inset:0;pointer-events:none;}
.tag{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.32);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:12px;letter-spacing:1px;color:#fff;}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;}
.status{position:absolute;right:12px;top:12px;padding:7px 14px;border-radius:999px;background:rgba(5,7,10,0.35);border:1px solid rgba(255,255,255,0.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:12px;letter-spacing:0.5px;color:#fff;max-width:58vw;text-align:right;}
.info{position:absolute;left:12px;bottom:12px;padding:6px 12px;border-radius:999px;background:rgba(5,7,10,0.3);border:1px solid rgba(255,255,255,0.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.85);}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:14px 12px calc(16px + env(safe-area-inset-bottom,0px));z-index:10;}
.btn{padding:12px 18px;border-radius:999px;border:1px solid rgba(255,255,255,0.38);background:rgba(255,255,255,0.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;font-size:13px;font-family:inherit;letter-spacing:1px;transition:opacity 0.2s;}
.btn:active{background:rgba(255,255,255,0.3);}
.btn.off{opacity:0.45;}
.btn[disabled]{opacity:0.5;}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#4f46e5,#7c3aed 45%,#db2777);z-index:20;overflow:hidden;padding:0 24px;}
.orb{position:absolute;border-radius:50%;filter:blur(70px);}
.o1{width:320px;height:320px;background:rgba(96,165,250,0.55);top:-90px;left:-90px;}
.o2{width:280px;height:280px;background:rgba(244,114,182,0.5);bottom:-80px;right:-80px;}
.card{position:relative;width:min(88vw,340px);border-radius:30px;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.4);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:42px 26px 34px;display:flex;flex-direction:column;align-items:center;gap:18px;color:#fff;box-shadow:0 24px 60px rgba(0,0,0,0.25);}
.card h1{font-size:26px;letter-spacing:10px;font-weight:500;text-indent:10px;}
.card p{font-size:12px;line-height:2.1;color:rgba(255,255,255,0.9);text-align:center;letter-spacing:0.5px;min-height:52px;}
.card button{width:100%;padding:15px 0;border-radius:999px;border:none;background:rgba(255,255,255,0.95);color:#5b21b6;font-size:15px;font-weight:800;letter-spacing:4px;font-family:inherit;text-indent:4px;}
.card button[disabled]{opacity:0.5;}
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="tag"><span class="dot"></span><span id="tagText">AI LENS</span></div>
      <div class="status" id="status">STANDBY</div>
      <div class="info" id="info">AI LENS</div>
    </div>
  </div>
</div>
<div class="bar" id="bar" style="display:none;">
  <button class="btn" id="btnFlip">切换镜头</button>
  <button class="btn" id="btnObj" disabled>物体框...</button>
  <button class="btn" id="btnPose" disabled>骨骼...</button>
</div>
<div id="start">
  <div class="orb o1"></div><div class="orb o2"></div>
  <div class="card">
    <h1>AI LENS</h1>
    <p id="startMsg">实时目标识别 + 人体骨骼<br>点一下启动，边扫边加载</p>
    <button id="startBtn" disabled>启动</button>
  </div>
</div>
<script src="https://gcore.jsdelivr.net/gh/tayyh19/ai-lens@main/js/tf.min.js"></script>
<script src="https://gcore.jsdelivr.net/gh/tayyh19/ai-lens@main/js/coco-ssd.min.js"></script>
<script src="https://gcore.jsdelivr.net/gh/tayyh19/ai-lens@main/js/pose-detection.min.js"></script>
<script>
(function(){
  var TF2='https://testingcf.jsdelivr.net/gh/tayyh19/ai-lens@main/js/tf.min.js';
  var CO2='https://testingcf.jsdelivr.net/gh/tayyh19/ai-lens@main/js/coco-ssd.min.js';
  var PO2='https://testingcf.jsdelivr.net/gh/tayyh19/ai-lens@main/js/pose-detection.min.js';
  function load(src,cb){ var s=document.createElement('script'); s.src=src; s.onload=cb; s.onerror=cb; document.head.appendChild(s); }
  function ensure(){
    if(typeof tf==='undefined'){ load(TF2,function(){ setTimeout(ensure,50); }); return; }
    if(typeof cocoSsd==='undefined'){ load(CO2,function(){ setTimeout(ensure,50); }); return; }
    if(typeof poseDetection==='undefined'){ load(PO2,function(){ setTimeout(ensure,50); }); return; }
    window.__LIBS_READY=true;
  }
  if(typeof tf!=='undefined'&&typeof cocoSsd!=='undefined'&&typeof poseDetection!=='undefined'){ window.__LIBS_READY=true; }
  else { ensure(); }
})();
</script>
<script>
function waitLibs(cb){ if(window.__LIBS_READY){ cb(); } else { setTimeout(function(){ waitLibs(cb); },120); } }
waitLibs(function(){
var SOURCES=[
  'https://gcore.jsdelivr.net/gh/tayyh19/ai-lens@main/',
  'https://testingcf.jsdelivr.net/gh/tayyh19/ai-lens@main/',
  'https://gcore.jsdelivr.net/gh/tayyh19/ai-lens@main/',
  'https://testingcf.jsdelivr.net/gh/tayyh19/ai-lens@main/',
  'https://gh-proxy.com/https://raw.githubusercontent.com/tayyh19/ai-lens/main/',
  'https://ghproxy.net/https://raw.githubusercontent.com/tayyh19/ai-lens/main/'
];
var FILES=[
  {rel:'models/movenet/model.json', size:168013, s:0},
  {rel:'models/movenet/group1-shard1of2.bin', size:4194304, s:1},
  {rel:'models/movenet/group1-shard2of2.bin', size:455912, s:5},
  {rel:'models/coco-ssd-lite/model.json', size:257764, s:4},
  {rel:'models/coco-ssd-lite/group1-shard1of4', size:2254332, s:0},
  {rel:'models/coco-ssd-lite/group1-shard2of4', size:2254332, s:1},
  {rel:'models/coco-ssd-lite/group1-shard3of4', size:2254332, s:0},
  {rel:'models/coco-ssd-lite/group1-shard4of4', size:2254332, s:0}
];
var video=document.getElementById('video');
var cv=document.getElementById('cv');
var ctx=cv.getContext('2d');
var statusEl=document.getElementById('status');
var infoEl=document.getElementById('info');
var tagText=document.getElementById('tagText');
var startMask=document.getElementById('start');
var startBtn=document.getElementById('startBtn');
var startMsg=document.getElementById('startMsg');
var bar=document.getElementById('bar');
var btnFlip=document.getElementById('btnFlip');
var btnObj=document.getElementById('btnObj');
var btnPose=document.getElementById('btnPose');
var EDGES=[[0,1],[0,2],[1,3],[2,4],[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];
var COLORS={person:'#ff5a5f',bicycle:'#43f5c3',car:'#43f5c3',motorcycle:'#43f5c3',bus:'#ffd166',truck:'#ffd166',cup:'#9fe8ff',bottle:'#9fe8ff',laptop:'#c084fc',tv:'#c084fc',cell_phone:'#ffd166',chair:'#43f5c3',dining_table:'#43f5c3',keyboard:'#c084fc',mouse:'#c084fc',book:'#ffd166',backpack:'#ff5a5f',clock:'#c084fc',potted_plant:'#4ade80',vase:'#4ade80',remote:'#9fe8ff',scissors:'#ffd166',teddy_bear:'#ff5a5f'};
var coco=null, detector=null;
var poseReady=false, objReady=false;
var objects=[], poses=[];
var running=false;
var facing='environment';
var showObj=true, showPose=true;
var frame=0, lastT=0, fpsSmooth=0;
var DL={loaded:0, total:0, done:false};
FILES.forEach(function(f){ DL.total+=f.size; });
var ASSETS=window.__AI_LENS.ASSETS;
var origFetch=window.__AI_LENS.origFetch;

function updStatusLoad(){
  var pct=Math.min(100, Math.round(DL.loaded/DL.total*100));
  if(pct>=100){ statusEl.textContent='资源就绪 · 模型初始化中...'; }
  else { statusEl.textContent='AI资源加载中 '+pct+'%'; }
}

async function fetchOne(f, attempt){
  var srcIdx=(f.s+attempt)%SOURCES.length;
  var url=SOURCES[srcIdx]+f.rel;
  var res=await origFetch(url);
  if(!res.ok){ throw new Error('HTTP '+res.status); }
  var ct=res.headers.get('content-type')||'';
  var buf;
  if(res.body && res.body.getReader){
    var reader=res.body.getReader();
    var chunks=[]; var got=0;
    while(true){
      var r=await reader.read();
      if(r.done){ break; }
      chunks.push(r.value);
      got+=r.value.length;
      DL.loaded+=r.value.length;
      updStatusLoad();
    }
    var all=new Uint8Array(got);
    var off=0;
    chunks.forEach(function(c){ all.set(c,off); off+=c.length; });
    buf=all.buffer;
  } else {
    var ab=await res.arrayBuffer();
    DL.loaded+=ab.byteLength;
    updStatusLoad();
    buf=ab;
  }
  return {rel:f.rel, buf:buf, ct:ct};
}

async function preloadGroup(files){
  await Promise.all(files.map(async function(f){
    var lastErr=null;
    for(var a=0;a<3;a++){
      try{
        var asset=await fetchOne(f,a);
        ASSETS.push(asset);
        return;
      }catch(e){ lastErr=e; }
    }
    try{ DL.loaded+=f.size; updStatusLoad(); }catch(e){}
    throw lastErr || new Error('fail '+f.rel);
  }));
}

function hasVisible(p){
  if(!p||!p.keypoints){return false;}
  for(var i=0;i<p.keypoints.length;i++){ if(p.keypoints[i].score>0.3){return true;} }
  return false;
}

function refreshTag(){
  if(poseReady&&objReady){ tagText.textContent='AI LENS / LIVE'; }
  else if(poseReady){ tagText.textContent='骨骼就绪 / 物体加载中'; }
  else if(objReady){ tagText.textContent='物体就绪 / 骨骼加载中'; }
  else { tagText.textContent='AI 初始化中'; }
}

async function loadPose(){
  try{
    detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,modelUrl:SOURCES[0]+'models/movenet/model.json'});
    poseReady=true;
    btnPose.disabled=false;
    btnPose.textContent='骨骼 ON';
    refreshTag();
  }catch(e){ btnPose.textContent='骨骼 加载失败'; }
}

async function loadCoco(){
  try{
    coco=await cocoSsd.load({base:'lite_mobilenet_v2',modelUrl:SOURCES[0]+'models/coco-ssd-lite/model.json'});
    objReady=true;
    btnObj.disabled=false;
    btnObj.textContent='物体框 ON';
    refreshTag();
  }catch(e){ btnObj.textContent='物体框 加载失败'; }
}

function draw(){
  if(video.videoWidth>0 && cv.width!==video.videoWidth){ cv.width=video.videoWidth; cv.height=video.videoHeight; }
  var w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  if(showObj){
    objects.forEach(function(b){
      var x=b.bbox[0],y=b.bbox[1],bw=b.bbox[2],bh=b.bbox[3];
      var color=COLORS[b.class]||'#43f5c3';
      ctx.strokeStyle=color;ctx.lineWidth=2;ctx.strokeRect(x,y,bw,bh);
      var text=(b.class==='cell_phone'?'phone':b.class)+' '+(b.score*100).toFixed(0)+'%';
      ctx.font='600 13px Consolas,monospace';
      var tw=ctx.measureText(text).width;
      ctx.fillStyle='rgba(5,7,10,0.62)';ctx.fillRect(x,y-20,tw+12,20);
      ctx.fillStyle=color;ctx.fillText(text,x+6,y-6);
    });
  }
  if(showPose){
    poses.forEach(function(p){
      var kp=p.keypoints;
      ctx.lineWidth=3;ctx.strokeStyle='#22f5ff';
      EDGES.forEach(function(e){
        var ka=kp[e[0]],kb=kp[e[1]];
        if(ka.score>0.3&&kb.score>0.3){ctx.beginPath();ctx.moveTo(ka.x,ka.y);ctx.lineTo(kb.x,kb.y);ctx.stroke();}
      });
      kp.forEach(function(k){
        if(k.score>0.3){ctx.beginPath();ctx.arc(k.x,k.y,4,0,6.2832);ctx.fillStyle='#ff3b6b';ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=1.5;ctx.stroke();}
      });
    });
  }
  var humanCount=0;
  poses.forEach(function(p){ if(hasVisible(p)){humanCount++;} });
  if(!running){ statusEl.textContent='STANDBY'; }
  else if(!DL.done){ updStatusLoad(); }
  else if(!poseReady&&!objReady){ statusEl.textContent='模型初始化中...'; }
  else if(poseReady&&!objReady){ statusEl.textContent='骨骼就绪 · 物体加载中 | '+Math.round(fpsSmooth)+' FPS'; }
  else if(!poseReady&&objReady){ statusEl.textContent='物体就绪 · 骨骼加载中 | '+Math.round(fpsSmooth)+' FPS'; }
  else { statusEl.textContent='TARGETS '+objects.length+' / HUMAN '+humanCount+' | '+Math.round(fpsSmooth)+' FPS'; }
}

async function loop(){
  frame++;
  var now=performance.now();
  var dt=now-lastT; lastT=now;
  if(dt>0){ var inst=1000/dt; fpsSmooth=fpsSmooth>0?fpsSmooth*0.9+inst*0.1:inst; }
  try{
    if(showPose && poseReady && frame%2===0){ poses=await detector.estimatePoses(video); }
    if(showObj && objReady && frame%3===0){ objects=await coco.detect(video,50,0.15); }
  }catch(e){}
  draw();
  if(running){ requestAnimationFrame(loop); }
}

async function startCamera(){
  if(video.srcObject){ video.srcObject.getTracks().forEach(function(t){t.stop();}); }
  var stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
  video.srcObject=stream;
  await video.play();
}

startBtn.addEventListener('click', async function(){
  startBtn.disabled=true;
  startBtn.textContent='启动中...';
  try{
    await startCamera();
    startMask.style.display='none';
    bar.style.display='flex';
    running=true; lastT=performance.now(); requestAnimationFrame(loop);
    updStatusLoad();
    preloadGroup(FILES.slice(0,3)).then(function(){
      loadPose();
    }).catch(function(){});
    preloadGroup(FILES.slice(3)).then(function(){
      DL.done=true;
      updStatusLoad();
      loadCoco();
    }).catch(function(){ DL.done=true; loadCoco(); });
  }catch(e){
    startBtn.textContent='重试';
    startBtn.disabled=false;
    startMsg.innerHTML='相机启动失败：请允许摄像头权限后重试';
  }
});

btnFlip.addEventListener('click', async function(){
  facing = facing==='environment' ? 'user' : 'environment';
  try{ await startCamera(); }catch(e){}
});

btnObj.addEventListener('click', function(){
  showObj=!showObj;
  btnObj.textContent='物体框 '+(showObj?'ON':'OFF');
  btnObj.className=showObj?'btn':'btn off';
  if(!showObj){ objects=[]; }
});

btnPose.addEventListener('click', function(){
  showPose=!showPose;
  btnPose.textContent='骨骼 '+(showPose?'ON':'OFF');
  btnPose.className=showPose?'btn':'btn off';
  if(!showPose){ poses=[]; }
});

startBtn.disabled=false;
setTimeout(function(){ try{ if(!running){ startBtn.click(); } }catch(e){} }, 400);
});
</script>
</body>
</html>
